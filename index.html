<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리 페이지</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f13;font-family:'Segoe UI',sans-serif;color:#e0e0e0;padding:40px 20px}.wrap{max-width:600px;margin:0 auto}h1{font-size:20px;color:#fff;margin-bottom:6px}.sub{color:#555;font-size:13px;margin-bottom:32px}.sec{background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:24px;margin-bottom:20px}.sec h2{font-size:14px;color:#aaa;margin-bottom:16px}.row{display:flex;gap:10px;margin-bottom:10px;align-items:center}.row input{flex:1;padding:9px 12px;background:#12121a;border:1px solid #2a2a3a;border-radius:7px;color:#e0e0e0;font-size:13px;outline:none}.row input:focus{border-color:#5865f2}.row input.u{flex:1.5}.del{background:none;border:none;color:#555;cursor:pointer;font-size:18px;padding:4px 8px;border-radius:4px}.del:hover{color:#e55;background:#2a1a1a}.ab{background:none;border:1px dashed #3a3a4a;color:#666;border-radius:7px;padding:9px;width:100%;cursor:pointer;font-size:13px;margin-top:4px}.ab:hover{border-color:#5865f2;color:#5865f2}.sb{width:100%;padding:13px;background:#5865f2;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}.sb:hover{background:#4752c4}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e1e2e;border:1px solid #5865f2;color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;display:none;z-index:99}.cl{display:flex;gap:10px;margin-bottom:4px}.cl span{flex:1;font-size:11px;color:#444}.cl span.u{flex:1.5}#aw{display:flex;align-items:center;justify-content:center;min-height:80vh}.ac{background:#1a1a24;border:1px solid #2a2a3a;border-radius:16px;padding:40px;width:320px;text-align:center}.ac h2{color:#fff;margin-bottom:20px}.ac input{width:100%;padding:11px 14px;background:#12121a;border:1px solid #2a2a3a;border-radius:8px;color:#e0e0e0;font-size:14px;outline:none;margin-bottom:12px}.ac input:focus{border-color:#5865f2}.ac button{width:100%;padding:12px;background:#5865f2;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}#am{color:#e55;font-size:12px;margin-top:8px}.hi{width:100%;padding:9px 12px;background:#12121a;border:1px solid #2a2a3a;border-radius:7px;color:#e0e0e0;font-size:13px;outline:none;margin-bottom:10px}.hi:focus{border-color:#5865f2}
</style>
</head>
<body>
<div id="aw"><div class="ac"><h2>관리자 인증</h2><input type="password" id="ap" placeholder="관리자 비밀번호" onkeydown="if(event.key==='Enter')_ac()"><button onclick="_ac()">확인</button><div id="am"></div></div></div>
<div class="wrap" id="mw" style="display:none">
  <h1>링크 관리</h1><p class="sub">Firebase에 저장된 링크를 수정합니다</p>
  <div class="sec"><h2>진짜 링크 (정답 비밀번호)</h2><div class="cl"><span>텍스트</span><span class="u">URL</span><span style="width:36px"></span></div><div id="rl"></div><button class="ab" onclick="_ar('rl')">+ 링크 추가</button><button class="sb" onclick="_sr()">저장</button></div>
  <div class="sec"><h2>가짜 링크 (가짜 비밀번호 입력 시)</h2><div class="cl"><span>텍스트</span><span class="u">URL</span><span style="width:36px"></span></div><div id="fl"></div><button class="ab" onclick="_ar('fl')">+ 링크 추가</button><button class="sb" onclick="_sf()">저장</button></div>
  <div class="sec"><h2>힌트 텍스트</h2><input type="text" id="hv" class="hi" placeholder="힌트 내용"><button class="sb" onclick="_sh()">저장</button></div>
</div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
var _$=[[42,47,38,34,37],[42,47,38,34,37,3,42,56,35],[122,121,127,101,126,114,101,121,126,123,101,121,122,123],[40,36,37,45,34,44],[39,34,37,32,56],[34,63,46,38,56],[45,42,32,46],[35,34,37,63],[63,46,51,63],[62,57,39],[10,2,49,42,24,50,10,120,122,12,42,42,58,127,114,47,29,38,3,18,20,41,31,38,14,127,35,50,102,62,102,0,25,2,20,27,5,123,26],[57,42,37,47,36,38,45,36,57,56,40,35,36,36,39,102,46,47,122,127,114,101,45,34,57,46,41,42,56,46,42,59,59,101,40,36,38],[57,42,37,47,36,38,45,36,57,56,40,35,36,36,39,102,46,47,122,127,114],[57,42,37,47,36,38,45,36,57,56,40,35,36,36,39,102,46,47,122,127,114,101,45,34,57,46,41,42,56,46,56,63,36,57,42,44,46,101,42,59,59],[122,123,122,122,114,124,120,120,127,125,122,122,125],[122,113,122,123,122,122,114,124,120,120,127,125,122,122,125,113,60,46,41,113,124,122,46,124,42,122,124,122,41,120,114,42,41,42,45,115,127,45,45,47,122,122]];
var _g=function(i){return _$[i].map(function(c){return String.fromCharCode(c^0x4B)}).join('')};
var ew={};
ew['apiKey']=_g(10);ew['authDomain']=_g(11);ew['projectId']=_g(12);ew['storageBucket']=_g(13);ew['messagingSenderId']=_g(14);ew['appId']=_g(15);
firebase.initializeApp(ew);
var db=firebase.firestore();
var _col=_g(3),_doc=_g(4);
var _it=_g(5),_fk=_g(6),_ht=_g(7),_tx=_g(8),_ur=_g(9);
var _aip=_g(2);

async function _h(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}

window['_ac']=async function(){
  var pw=document.getElementById('ap').value;
  if(!pw)return;
  try{
    var _ir=await fetch('https://api.ipify.org?format=json');
    var _ij=await _ir.json();
    if(_ij.ip!==_aip){document.getElementById('am').textContent='접근 권한이 없습니다.';return}
    var hash=await _h(pw);
    var snap=await db.collection(_col).doc(_g(0)).get();
    if(snap.exists&&snap.data()[_g(1)]===hash){
      document.getElementById('aw').style.display='none';
      document.getElementById('mw').style.display='block';
      _ld();
    } else {
      document.getElementById('am').textContent='비밀번호가 틀렸습니다.';
    }
  }catch(e){
    document.getElementById('am').textContent='오류: '+e.message;
  }
};

function _mk(lid,t,u){
  t=t||'';u=u||'';
  var r=document.createElement('div');
  r.className='row';
  r.innerHTML='<input type="text" placeholder="텍스트" value="'+t+'"><input type="text" class="u" placeholder="https://" value="'+u+'"><button class="del" onclick="this.parentElement.remove()">×</button>';
  document.getElementById(lid).appendChild(r);
}
window['_ar']=function(lid){_mk(lid)};

function _gr(lid){
  return [...document.getElementById(lid).querySelectorAll('.row')].map(function(r){
    var ins=r.querySelectorAll('input');
    var o={};o[_tx]=ins[0].value.trim();o[_ur]=ins[1].value.trim();return o;
  }).filter(function(o){return o[_tx]&&o[_ur]});
}

async function _ld(){
  var d=await db.collection(_col).doc(_doc).get();
  if(!d.exists)return;
  var v=d.data();
  document.getElementById('rl').innerHTML='';
  document.getElementById('fl').innerHTML='';
  (v[_it]||[]).forEach(function(o){_mk('rl',o[_tx],o[_ur])});
  (v[_fk]||[]).forEach(function(o){_mk('fl',o[_tx],o[_ur])});
  document.getElementById('hv').value=v[_ht]||'';
}

window['_sr']=async function(){var u={};u[_it]=_gr('rl');await db.collection(_col).doc(_doc).update(u);_toast('진짜 링크 저장 완료!')};
window['_sf']=async function(){var u={};u[_fk]=_gr('fl');await db.collection(_col).doc(_doc).update(u);_toast('가짜 링크 저장 완료!')};
window['_sh']=async function(){var u={};u[_ht]=document.getElementById('hv').value;await db.collection(_col).doc(_doc).update(u);_toast('힌트 저장 완료!')};

function _toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}
document.getElementById('ap').addEventListener('keydown',function(e){if(e.key==='Enter')window['_ac']()});
})();
</script>
</body>
</html>
